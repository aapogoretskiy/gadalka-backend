spring:
  application:
    name: gadalka-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gadalka}
    username: ${SPRING_DATASOURCE_USERNAME:gadalka}
    password: ${SPRING_DATASOURCE_PASSWORD:gadalka}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Лимит размера тела HTTP-запроса (защита от DoS)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  tomcat:
    # Максимальный размер тела для обычных POST-запросов
    max-swallow-size: 20MB

telegram:
  auth:
    enable: ${TELEGRAM_AUTH_ENABLE:false}
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: magicliora_bot
    app-url: https://magicliora.com/
    enabled: true

jwt:
  secret: ${JWT_SECRET}

# ЮKassa — платёжный провайдер для рублёвых платежей
yookassa:
  shop-id: ${YOOKASSA_SHOP_ID}
  secret-key: ${YOOKASSA_SECRET_KEY}
  api-url: https://api.yookassa.ru/v3
  # URL куда ЮKassa перенаправит пользователя после оплаты
  return-url: ${YOOKASSA_RETURN_URL:https://magicliora.com/payment/result}
  webhook:
    # Фильтрация запросов на webhook по IP-адресам ЮKassa
    # В dev отключить: YOOKASSA_WEBHOOK_IP_FILTER_ENABLED=false
    # В продакшне всегда true
    ip-filter-enabled: ${YOOKASSA_WEBHOOK_IP_FILTER_ENABLED:true}

# Robokassa — платёжный провайдер с автофискализацией для СМЗ
robokassa:
  merchant-login: ${ROBOKASSA_MERCHANT_LOGIN}
  password1: ${ROBOKASSA_PASSWORD1}
  password2: ${ROBOKASSA_PASSWORD2}
  # true = тестовый режим (параметр IsTest=1 в URL, деньги не списываются)
  test-mode: ${ROBOKASSA_TEST_MODE:true}
  webhook:
    # Фильтрация запросов на ResultURL по IP-адресам Robokassa
    # В dev отключить: ROBOKASSA_WEBHOOK_IP_FILTER_ENABLED=false
    # В продакшне всегда true
    ip-filter-enabled: ${ROBOKASSA_WEBHOOK_IP_FILTER_ENABLED:true}

# Настройки платёжной системы
payment:
  # Активный провайдер рублёвых платежей: robokassa | yookassa
  # Переключается через PAYMENT_RUB_PROVIDER без передеплоя фронтенда
  rub-provider: ${PAYMENT_RUB_PROVIDER:robokassa}
  # Scheduler для обработки очереди webhook'ов
  # fixedDelay: задержка между окончанием предыдущего и началом следующего запуска (мс)
  webhook:
    process-delay-ms: ${PAYMENT_WEBHOOK_PROCESS_DELAY_MS:30000}
  # Автоотмена зависших PENDING-платежей (PendingPaymentExpiryService).
  # Таймаут разный по провайдерам: Stars подтверждаются за секунды (нативный диалог,
  # без ввода данных), Robokassa/ЮKassa — десятки секунд - минуты (ввод карты).
  pending-expiry:
    stars-timeout-minutes: ${PAYMENT_PENDING_STARS_TIMEOUT_MINUTES:5}
    card-timeout-minutes: ${PAYMENT_PENDING_CARD_TIMEOUT_MINUTES:30}
    check-interval-ms: ${PAYMENT_PENDING_EXPIRY_CHECK_INTERVAL_MS:300000}
  # Догоняющие напоминания о брошенной оплате (PaymentRecoveryService).
  # Окно возраста платежа: [min-age, max-age] минут — снизу не дёргаем тех, кто
  # пробует прямо сейчас; сверху не рассылаем по старым платежам после деплоя.
  # cooldown-days — не чаще одного напоминания на пользователя в N дней.
  recovery:
    enabled: ${PAYMENT_RECOVERY_ENABLED:true}
    min-age-minutes: ${PAYMENT_RECOVERY_MIN_AGE_MINUTES:60}
    max-age-minutes: ${PAYMENT_RECOVERY_MAX_AGE_MINUTES:180}
    cooldown-days: ${PAYMENT_RECOVERY_COOLDOWN_DAYS:7}
    check-interval-ms: ${PAYMENT_RECOVERY_CHECK_INTERVAL_MS:900000}

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  url: https://openrouter.ai/api/v1/chat/completions
  model: openai/gpt-4o-mini

aitunnel:
  api-key: ${AITUNNEL_API_KEY}
  url: https://api.aitunnel.ru/v1/chat/completions
  model: deepseek-v4-flash

# Swagger/OpenAPI: по умолчанию ВЫКЛЮЧЕН
# В dev: добавить в .env или Run Configuration: SWAGGER_ENABLED=true
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

# Spring Actuator: открываем только /health, остальное скрываем
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  cors:
    # В dev можно добавить: http://localhost:5173,http://localhost:3000
    # .ru оставлен как fallback на период перехода
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://magicliora.com,https://magicliora.ru}

logging:
  level:
    root: INFO
    ru.sapa.gadalka_backend: DEBUG

# Пример: ADMIN_TELEGRAM_IDS=123456789,987654321,111111111
admin:
  telegram-ids: ${ADMIN_TELEGRAM_IDS:415957920}